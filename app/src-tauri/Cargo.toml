[package]
name = "app"
version = "0.1.0"
description = "Local-first AI beatmap generation desktop application"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
sysinfo = "0.39"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "system-proxy"] }
sha2 = "0.11.0"
flate2 = "1.1.10"
tar = "0.4.46"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tauri-plugin-notification = "2.6.0"
