name: Bug report
description: Report a reproducible Beatforge application problem without sharing song or beatmap content.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach songs, `.osu`/`.osz` files, images, videos, raw databases, or raw logs. Use Settings → Diagnostics export, review its contents, and share only the generated diagnostic ZIP if appropriate.
  - type: input
    id: version
    attributes:
      label: Beatforge version or commit
    validations:
      required: true
  - type: input
    id: diagnostic
    attributes:
      label: Diagnostic ID
      description: Optional BF-DIAG identifier shown before export. Do not paste the contents of private files.
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Describe actions and settings without identifying the song, artist, or local path.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include stable error codes and job status, but remove personal paths and media metadata.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not attach songs, beatmaps, media, databases, raw logs, credentials, or personal paths.
          required: true
